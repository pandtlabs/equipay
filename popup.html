<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>equiPay</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        width: 320px;
        margin: 0;
        color: #222;
        font-size: 13px;
      }
      header {
        padding: 12px 14px 6px;
      }
      h1 {
        font-size: 15px;
        margin: 0;
      }
      p.lede {
        font-size: 12px;
        color: #555;
        margin: 4px 0 0;
      }
      .choices {
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      button.choice {
        text-align: left;
        padding: 9px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        color: #222;
      }
      button.choice:hover {
        background: #f4f8ff;
        border-color: #2a6df4;
      }
      button.choice.remembered {
        border-color: #2a6df4;
        box-shadow: inset 0 0 0 1px #2a6df4;
      }
      .choice .sub {
        display: block;
        font-size: 11px;
        color: #666;
        margin-top: 2px;
      }
      #status {
        padding: 0 14px 8px;
        font-size: 12px;
        min-height: 15px;
      }
      footer {
        padding: 8px 14px;
        border-top: 1px solid #eee;
        font-size: 12px;
      }
      footer a {
        color: #2a6df4;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>equiPay</h1>
      <p class="lede">Capture this job posting and file with:</p>
    </header>
    <div class="choices" id="choices"></div>
    <div id="status"></div>
    <footer><a id="options">Claimant info (Options)</a></footer>
    <script src="jurisdictions.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
